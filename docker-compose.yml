version: '3.8'

services:
  spbu-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spbu-management-system
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://anfalhidayat.web.id/api
      - NEXT_PUBLIC_APP_URL=https://anfalhidayat.web.id
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY_IN=7d
    networks:
      - spbu-network
    # Optional: Add health check
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: spbu-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - spbu-app
    networks:
      - spbu-network

networks:
  spbu-network:
    driver: bridge

volumes:
  ssl:
